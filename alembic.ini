# Alembic configuration.
#
# The database URL is intentionally NOT stored here - it is read from the
# application settings (and therefore from the environment) inside
# migrations/env.py, so no credential ever lands in version control.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = python
ruff.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
