# Hierarchical skill taxonomy.
#
# The NLP layer contains no hard-coded technology list: everything it can
# recognise is declared here. Adding a technology, an alias or a whole branch
# is a configuration change that needs no code and no redeployment of logic.
#
# groups .... hierarchy nodes (a skill's `parent` points at one of them)
# skills .... leaves that can be detected in text
#
# Per-skill options:
#   aliases     - additional spellings matched case-insensitively
#   ambiguous   - the name is a common English word (Go, R, C); a match only
#                 counts when it is delimited or qualified by tech context
#   weight      - relative importance when scoring a posting (default 1.0)

