# Static exchange rates used to express salaries in a single currency.
#
# These rates are a *stated assumption*, not live market data. They are dated
# so that every derived figure can be traced back to the snapshot it came from,
# and any currency missing from this table is simply left un-normalized rather
# than converted with a guessed rate.
#
# Replace this file (or point JOBINTEL_ANALYTICS__* at another one) whenever you
# have a better source; the platform never invents a rate it does not have.

